name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 测试（Windows / Python ${{ matrix.python }}）
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pillow pystray

      - name: 语法检查（全量编译）
        run: python -m compileall -q . -x "(.tmp|build|dist|__pycache__|work)"

      - name: 运行单元测试
        run: python run_tests.py

      - name: 敏感信息扫描
        run: python tools/scan_secrets.py

  build-check:
    name: 打包冒烟（PyInstaller 能构建）
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install pillow pystray pyinstaller
      - name: 构建 exe
        run: python -m PyInstaller --noconfirm DeepSeekTokenMonitor.spec
      - name: 确认产物存在
        run: |
          if (-not (Test-Path dist/DeepSeekTokenMonitor.exe)) { exit 1 }
          Write-Host "构建产物 OK"
        shell: pwsh