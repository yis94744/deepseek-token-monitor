# ⚠️ 本文件需要移动到 .github/workflows/ci.yml 才会被 GitHub Actions 识别。
#
# 当前放在这里的唯一原因：推送用的 gh token 缺少 workflow scope，GitHub 拒绝
# 通过 API/git push 更新 .github/workflows/** 下的文件。
#
# 启用步骤（一次性，需在你的账号下授权）：
#   gh auth refresh -h github.com -s workflow
#   git mv .github/ci-workflow.yml .github/workflows/ci.yml
#   git commit -m "ci: 启用 GitHub Actions" && git push
#
# 内容本身是完整的、可直接使用的工作流定义。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 测试（Windows / Python ${{ matrix.python }}）
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pillow pystray
          pip install paramiko

      - name: 语法检查（全量编译）
        run: python -m compileall -q . -x "(.tmp|build|dist|__pycache__|work)"

      - name: 运行单元测试
        run: python run_tests.py

      - name: 敏感信息扫描
        run: python tools/scan_secrets.py

  build-check:
    name: 打包冒烟（PyInstaller 能构建）
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install pillow pystray pyinstaller
      - name: 构建 exe
        run: python -m PyInstaller --noconfirm DeepSeekTokenMonitor.spec
      - name: 确认产物存在
        run: |
          if (-not (Test-Path dist/DeepSeekTokenMonitor.exe)) { exit 1 }
          Write-Host "构建产物 OK"
        shell: pwsh